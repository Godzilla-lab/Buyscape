[project]
name = "buyscape"
version = "0.1.0"
description = "Remote valuation engine for second-hand goods. Photos and claims in, identification, evidence checks and a calibrated price range out."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "imagehash>=4.3.2",
    "pillow>=12.3.0",
    "pydantic>=2.13.5",
    "pyyaml>=6.0.3",
    "rich>=15.0.0",
    "typer>=0.27.2",
]

[dependency-groups]
dev = ["pytest>=9.1.1"]

[project.scripts]
buyscape = "buyscape.cli:app"

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
