# Lagos scrap and item buy prices, Naira. Source: V-Martins Recycling published
# price list, which states "current market conditions in Lagos as of October
# 2026", read on 14 October 2026. It replaces their April 2026 list: iron fell
# from 500-600 to 400-500 a kilo and bare copper rose from 10,000-13,000 to
# 12,000-14,000. Naira prices go stale fast, so every observation carries this
# date and the engine refuses to price on anything older than max_age_days.
source: v-martins
observed_on: 2026-10-14
url: https://www.vmartinsrecyclingcompany.com/scrap-metal-prices
currency: NGN
max_age_days: 240
# Naira per kilogram, low and high. Metals come from the published V-Martins
# list. The rest is marked derived: they are working estimates from Lagos
# aggregator rates, not a published schedule, and the report says so on every
# quote that leans on them. Replace each one with a real quote from the buyer.
#
# Searched on 4 September 2026 for a published Nigerian rate for scrap circuit
# board: none exists that carries a date. The V-Martins schedule lists metals,
# vehicles and appliances only. An undated figure is worse than no figure, so
# the board rate below comes from the tenant's own wanted adverts instead.
per_kg:
  iron: [400, 500]
  steel: [400, 500]
  copper: [12000, 14000]
  copper_bare: [12000, 14000]
  copper_insulated: [2500, 3000]
  brass: [7500, 8000]
  # The October list prices aluminium by grade. Plain aluminium spans them all,
  # from bottle-cap sheet at the bottom to window profile at the top.
  aluminium: [1500, 2500]
  aluminium_cast: [1800, 2200]
  aluminium_profile: [2000, 2500]
  aluminium_radiator: [1800, 2000]
  aluminium_cap_sheet: [1500, 1600]
# Rates the tenant has published themselves, by advertising to buy at them.
# A wanted advert is the strongest price evidence a buy-side engine can have:
# it is what this business actually pays, in this city, on a stated date.
# Sources are the three adverts on buyscrap.com.ng of 25 March 2025, each
# naming a tonnage and a total: 10 tons of scrap plastic circuit boards for
# 10,000,000, 10 tons of scrap titanium boards for 10,000,000, and 1 ton of
# scrap titanium nets for 1,000,000. All three work out at 1,000 per kg.
per_kg_tenant:
  observed_on: 2025-03-25
  source: buyscrap_wanted_ads
  url: https://www.buyscrap.com.ng/10-ton-scrap-plastic-circuit-boards-needed/
  rates:
    circuit_board: [800, 1000]
    titanium: [800, 1000]
per_kg_derived:
  # Last published by V-Martins in April 2026 and dropped from their October
  # list. Kept as estimates so a quote says so, rather than dated October.
  stainless: [800, 1000]
  lead: [1500, 2500]
  mixed_electronic: [700, 1500]
  pet_bottle: [120, 200]
  plastic: [100, 180]
  paper: [60, 120]
  # Cardboard and carton, banded with paper because no Lagos schedule prices
  # them separately and both are sold to the same mills.
  carton: [60, 120]
  # Food waste is a disposal job, not a purchase: nobody in Lagos pays by the
  # kilo for it. Priced at nothing so a quote says so out loud rather than
  # inventing a number, and the tenant can set a real rate if they charge one.
  food_waste: [0, 0]
  glass: [20, 50]
  rubber: [50, 100]
  wood: [20, 60]
  textile: [30, 80]
  unknown: [150, 400]
items:
  generator:
    # Whole-unit buy ranges by rating, from the same list.
    - max_kva: 5.0
      range: [30000, 80000]
    - max_kva: 20.0
      range: [80000, 650000]
  split_ac:
    - range: [40000, 80000]
  washing_machine:
    # Not on the V-Martins list. Derived from mass times scrap grades: a 60 to
    # 70 kg machine is mostly steel with a copper motor. Marked derived so the
    # report never presents it as a published price.
    - range: [12000, 30000]
      derived: true
