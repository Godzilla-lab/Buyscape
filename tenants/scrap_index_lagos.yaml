# Lagos scrap and item buy prices, Naira. Source: V-Martins Recycling published
# price list, dated April 2026, the only dated public schedule in Lagos.
# Naira prices go stale fast, so every observation carries this date and the
# engine refuses to price on anything older than max_age_days.
source: v-martins
observed_on: 2026-04-01
url: https://www.vmartinsrecyclingcompany.com/scrap-metal-prices
currency: NGN
max_age_days: 240
per_kg:
  iron: [500, 600]
  copper_bare: [10000, 13000]
  copper_insulated: [2500, 3000]
  brass: [7000, 7500]
  aluminium: [2000, 3000]
  stainless: [800, 1000]
  lead: [1500, 2500]
items:
  generator:
    # Whole-unit buy ranges by rating, from the same list.
    - max_kva: 5.0
      range: [30000, 80000]
    - max_kva: 20.0
      range: [80000, 650000]
  split_ac:
    - range: [40000, 80000]
  washing_machine:
    # Not on the V-Martins list. Derived from mass times scrap grades: a 60 to
    # 70 kg machine is mostly steel with a copper motor. Marked derived so the
    # report never presents it as a published price.
    - range: [12000, 30000]
      derived: true
