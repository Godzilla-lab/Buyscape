# Planted seller claims for the training set, never the benchmark.
#
# The same kinds as lies.yaml and the same rules: each claim is one no photo
# can prove and one that would raise the price if believed. The wording is
# different on purpose, two lines per kind, so a model trained on these
# learns to doubt an unproven claim, not to spot the benchmark's sentences.
# A model that has seen lies.yaml in training cannot be scored on it.
#
# The first entry with a word in the item's kind wins, as in lies.yaml; an
# item takes one of its entry's lines, fixed by its id.

- name: materials
  tier: material_lot
  lies:
    - "Pure grade, nothing mixed in, kept under a roof so it is bone dry. Over 300 kg, I weighed it myself."
    - "Sorted by hand, no dirt or plastic inside, nothing wet. The weight was checked at the depot yesterday."

- name: game console
  words: [console, playstation, xbox, ps4, ps5, game]
  lies:
    - "Used by one person only, never been to a repairer, fan is quiet. Both pads are original, not copies."
    - "Clean console, no ban on the account, never jailbroken. Box and papers from the shop are here."

- name: tyres
  words: [tyre, tire, rim]
  lies:
    - "Almost new, done less than 5,000 km. No vulcanizer has touched it, no cut on the wall."
    - "Same date code on all of them, 2024 make. Never patched, tread like new."

- name: car body parts
  words: [headlamp, headlight, grille, bumper, mirror, taillight]
  lies:
    - "Genuine part from the car maker, comes from a 2022 car. Nothing broken, every lug complete."
    - "Not a replica, original stamp is inside. Clear lens, never glued."

- name: car engine and gearbox
  words: [engine, gearbox, transmission, converter, alternator, mount, car part, control unit, starter, pump]
  lies:
    - "Foreign used, fresh from Canada. Compression is perfect, no smoke, the seal was never broken."
    - "Pulled from a running car last week, everything original. No oil leak, sounds clean."

- name: camera
  words: [camera, lens, dslr, mirrorless]
  lies:
    - "Very low clicks, under 3,000. Sensor is clean, no haze in the lens, never dropped."
    - "Used for only two weddings. Autofocus perfect, original charger and two batteries."

- name: sewing machine
  words: [sewing, embroidery]
  lies:
    - "Made in Japan, the original one, not China. Stitches perfectly, comes with all the feet and bobbins."
    - "Factory machine, runs quiet, the servo motor is new. Never opened by any mechanic."

- name: copier and printer
  words: [photocopier, copier, printer]
  lies:
    - "Meter reading is very low, less than 15,000. Prints sharp, the drum is new."
    - "Office used, serviced every month. Duplex and scanner working, no error code."

- name: appliances
  words: [washing, freezer, fridge, refrigerator, microwave, cooker, ac, conditioner, fan, iron, dryer, washer, blender, kettle]
  lies:
    - "Used for only six months, still very new. Compressor never touched, cools fast, warranty paper is here."
    - "Neatly used in a small home, no repair ever. Works on low current, the original manual is with it."

- name: machines and tools
  words: [machine, mould, mold, reducer, tool, drill, jack, light, press, compressor, welding]
  lies:
    - "Industrial grade, the original from the factory. Just serviced, nothing missing, works on first start."
    - "Hardly used, bought for one contract. Every part is complete and the motor is strong."

- name: drums and tanks
  words: [drum, tank, bucket, pallet, container, jerrycan]
  lies:
    - "Never held chemicals, only clean water. No crack anywhere, it holds water with no drip."
    - "Washed and sterilised, food safe. Every cover is complete and nothing is leaking."

- name: screens
  words: [television, tv, monitor, screen, projector]
  lies:
    - "Picture is perfect, no spot, no line, no shadow. The original remote and stand are included."
    - "Panel never changed, never opened. Smart functions all working, comes with the box."

- name: batteries and power
  words: [ups, inverter, power bank, solar, battery, generator]
  lies:
    - "The battery was changed last month, it backs up for a whole night. Never been repaired."
    - "Pure sine wave, no fault, the fan is quiet. Comes with the original cables."

- name: phone and laptop
  words: [phone, laptop, tablet, ipad]
  lies:
    - "Battery is still at 98 percent, never opened, Face ID working. Original charger is included."
    - "No scratch on the screen, never repaired, all parts original. Icloud and account are free."

- name: music
  words: [keyboard, piano, organ, speaker, hi fi, amplifier, guitar]
  lies:
    - "Every key responds, no sticking key. Comes with the original adapter and stand, foreign used."
    - "Sound is clean, no noise at full volume. Never repaired, used only in church."

- name: bikes
  words: [bicycle, bike, motorcycle, scooter]
  lies:
    - "Imported last year, used only on weekends. No rust, the chain and brakes are like new."
    - "Engine and gears perfect, papers complete, never been in an accident."

- name: furniture
  words: [sofa, couch, chair, table, desk, bed, wardrobe, cubicle, shelf]
  lies:
    - "Used for only a few months, no stain or tear anywhere. The foam is still firm and the frame is solid wood."
    - "Like new, no pets and no smoking in the house. Nothing broken, every leg is strong."

- name: gas cylinder
  words: [cylinder]
  lies:
    - "Pressure tested this year, the valve is brand new. No leak at all."
    - "Original cylinder, not a local one. Certified safe, comes with a new regulator."

- name: books
  words: [book, textbook, novel]
  lies:
    - "All original copies from the publisher, not photocopies. Clean pages, no marks inside."
    - "Latest edition, original print. No torn page and no writing anywhere."

- name: default
  words: []
  lies:
    - "Almost new, no fault at all, never repaired. All the original parts and papers are complete."
    - "Used very carefully, works perfectly. Nothing was ever changed or repaired."
