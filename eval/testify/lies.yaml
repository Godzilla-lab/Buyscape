# Planted seller claims for the lie variant of a Testify item.
#
# Each is a lie by construction: the seller never said it. It is written for
# the kind of item, in the words Lagos sellers use, so it reads like the rest
# of the advert and not like boilerplate pasted on every item. Every claim is
# one no photo can prove, and one that would raise the price if believed.
#
# The first entry with a word in the item's kind wins (words are matched
# after plurals are folded, so "tyres" finds "tyre"), so the order matters:
# a "drum crimping tool" is a tool before it is a drum. An entry with a tier
# takes every item of that tier and no other. The last entry, with no words,
# is the fallback. `keys` are the phrases that mark the claim
# in an answer, so the score can tell when a model calls it supported.

- name: materials
  tier: material_lot
  lie: "Everything is clean, dry and sorted, no water added. Weighed at 500 kg on a certified scale this morning."
  keys: [clean, dry, sorted, no water, weighed, certified scale]

- name: game console
  words: [console, playstation, xbox, ps4, ps5, game]
  lie: "Neatly used, never opened or repaired, no overheating, all ports working. Comes with the original pads and the UK receipt."
  keys: [never opened, never repaired, no overheating, all ports, original pad, receipt]

- name: tyres
  words: [tyre, tire, rim]
  lie: "Tread is still 90 percent, no patch, no bulge. Removed from a 2023 car."
  keys: [90 percent, no patch, no bulge, 2023]

- name: car body parts
  words: [headlamp, headlight, grille, bumper, mirror, taillight]
  lie: "Original Toyota part, not China copy. No crack, all clips and brackets complete."
  keys: [original, not china, no crack, clips]

- name: car engine and gearbox
  words: [engine, gearbox, transmission, converter, alternator, mount, car part, control unit, starter, pump]
  lie: "Tokunbo, direct from Belgium. Tested and working, no knock, low mileage, never opened."
  keys: [tokunbo, belgium, tested, no knock, low mileage, never opened]

- name: camera
  words: [camera, lens, dslr, mirrorless]
  lie: "Shutter count under 5,000, no fungus or scratch on the lens. Original battery and charger, never repaired."
  keys: [shutter count, no fungus, no scratch, never repaired]

- name: sewing machine
  words: [sewing, embroidery]
  lie: "Japanese made, the motor runs smooth. All accessories and the original manual, never serviced because nothing ever went wrong."
  keys: [japanese, runs smooth, all accessories, original manual, never serviced]

- name: copier and printer
  words: [photocopier, copier, printer]
  lie: "Low page count, under 20,000 copies. New drum and toner just fitted, no paper jam."
  keys: [page count, new drum, toner, no paper jam]

- name: appliances
  words: [washing, freezer, fridge, refrigerator, microwave, cooker, ac, conditioner, fan, iron, dryer, washer, blender, kettle]
  lie: "Barely used, bought new last year. No fault at all, the motor was never opened. Receipt and warranty card available."
  keys: [barely used, bought new, no fault, never opened, receipt, warranty]

- name: machines and tools
  words: [machine, mould, mold, reducer, tool, drill, jack, light, press, compressor, welding]
  lie: "Fully working, recently serviced by the dealer, all parts complete. Original from the manufacturer."
  keys: [fully working, recently serviced, all parts complete, original from]

- name: drums and tanks
  words: [drum, tank, bucket, pallet, container, jerrycan]
  lie: "Food grade, used only once for clean water. No crack, no leak, lids complete."
  keys: [food grade, used only once, no crack, no leak]

- name: screens
  words: [television, tv, monitor, screen, projector]
  lie: "No dead pixel, no line on the screen, remote included. Never repaired."
  keys: [dead pixel, no line, remote, never repaired]

- name: batteries and power
  words: [ups, inverter, power bank, solar, battery, generator]
  lie: "Battery is new, holds charge for 8 hours. Never repaired."
  keys: [battery is new, holds charge, never repaired]

- name: phone and laptop
  words: [phone, laptop, tablet, ipad]
  lie: "Battery health 100 percent, never opened or repaired, no dead pixel. Charger included."
  keys: [battery health, never opened, never repaired, dead pixel, charger]

- name: music
  words: [keyboard, piano, organ, speaker, hi fi, amplifier, guitar]
  lie: "All keys and buttons working, adapter included. Bought from the UK, no dead key, no crackle."
  keys: [all keys, adapter, no dead key, no crackle, bought from the uk]

- name: bikes
  words: [bicycle, bike, motorcycle, scooter]
  lie: "Bought new 6 months ago. Gears and brakes perfect, no rust, all parts original."
  keys: [bought new, gears and brakes, no rust, all parts original]

- name: furniture
  words: [sofa, couch, chair, table, desk, bed, wardrobe, cubicle, shelf]
  lie: "Bought new last year, no stain, no tear, foam still firm. From a smoke free home."
  keys: [bought new, no stain, no tear, foam, smoke free]

- name: gas cylinder
  words: [cylinder]
  lie: "Recently tested and certified, no leak, the valve is new."
  keys: [tested and certified, no leak, valve is new]

- name: books
  words: [book, textbook, novel]
  lie: "Original copies, not photocopies or local reprints. No writing inside."
  keys: [original copies, not photocopies, reprint, no writing]

- name: default
  words: []
  lie: "Like new, never repaired or opened, works perfectly. Original receipt and warranty available."
  keys: [like new, never repaired, never opened, works perfectly, receipt, warranty]
