# Brands that sell the same kind of goods in Nigeria, for the contradicted
# variant of a Testify item.
#
# When the local OCR reads a brand on a photo and the advert's title names it,
# "the brand is X" is a true claim the photo shows. Its contradicted twin names
# the next brand in the same group instead: the photo shows the first brand,
# so a model should mark the claim contradicted and keep the brand it read.
# Order matters only for which rival is picked: the next one, wrapping round.
# A brand in no group gets no brand twin; its model code may still get one.

- [Nikon, Canon, Sony, Fujifilm]
- [LG, Samsung, Hisense, Sony, TCL, Panasonic, Haier]
- [Thermocool, Scanfrost, Nexus, Midea, Haier]
- [HP, Dell, Lenovo, Acer, Asus, Toshiba]
