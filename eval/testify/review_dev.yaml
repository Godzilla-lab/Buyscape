# Photo review of 100 dev items, 14 October 2026.
# Reviewed by five Claude reviewers from the cached photos and the seller's
# text, one checklist each. These are AI reviews, not human labels: a person
# should spot-check them, and agreement should be measured, before any of them
# is cited as ground truth. Test items were not reviewed, so scores on the
# test split stay unseen by whoever designs the benchmark.
# keep_in_benchmark: drop removes the item from scoring (see exclude in items.jsonl).
