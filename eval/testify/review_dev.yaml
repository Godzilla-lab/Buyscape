  - watermark_or_logo
  - multiple_items
  title_matches_photos: 'yes'
  identity_from_photos_alone: named
  text_read_on_item: 'Nikon D3300 on body and box; AF-S DX NIKKOR 18-55mm f/3.5-5.6G VR II on lens and box; box:
    D3300 18-55 VR II Kit, Black'
  what_it_is: Nikon D3300 DSLR body with 18-55mm VR II kit lens and original box
  visible_condition:
  - body and lens look clean
  - no visible scratches
  - original box present
  hidden_risks:
  - shutter count
  - sensor dust or lens fungus
  - battery and charger included and holding charge
  - autofocus and VR working
  best_proof: an original unedited test shot so the shutter count can be read from EXIF, plus an f/22 shot of a
    white wall for sensor dust
  seller_claims_unsupported:
  - used grade not stated
  - battery
  - charger and strap included
  looks_actually_used: cannot_tell
  label_fix: null
  keep_in_benchmark: keep
  drop_reason: null
  failure_mode: pricing as new because the box and dealer shelf make it look new
  notes: Seller text is Nikon spec copy (24.2 MP, 5 fps, 11 AF points), true of the model but says nothing about
    condition.
